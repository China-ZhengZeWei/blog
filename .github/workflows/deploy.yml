name: Deploy VitePress to BaoTa Server

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build VitePress site
        run: npm run docs:build

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "Key file size: $(wc -c < ~/.ssh/id_ed25519) bytes"

      - name: Test SSH connection
        run: |
          ssh -i ~/.ssh/id_ed25519 \
              -p ${SSH_PORT:-22} \
              -o StrictHostKeyChecking=no \
              -o ConnectTimeout=15 \
              -o BatchMode=yes \
              ${SSH_USER}@${SSH_HOST} \
              "echo 'SSH_OK' && echo 'Deploy path exists:' && ls -la ${DEPLOY_PATH}"

      - name: Deploy via rsync
        run: |
          rsync -avz --delete \
            -e "ssh -p ${SSH_PORT:-22} -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no -o ConnectTimeout=15" \
            docs/.vitepress/dist/ \
            ${SSH_USER}@${SSH_HOST}:${DEPLOY_PATH}/
